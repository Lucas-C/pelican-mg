{% extends "base.html" %}
{% block title %}Musique que j'écoute{% endblock %}
{% block meta_desc %}{% endblock %}

{% block content %}
<div class="uk-width-medium-4-5">
    <h1 class="uk-heading-large">Musique que j'écoute</h1>
    {{ LISTENINGS_INTRO }}
    <div class="uk-grid">
    {% for listening in LISTENINGS %}
        {% if 'url' in listening %}
        <a href="{{ listening['url'] }}" class="uk-width-1-1 uk-width-small-1-2 uk-width-medium-1-3">
        <figure>
        {% else %}
        <figure class="uk-width-1-1 uk-width-small-1-2 uk-width-medium-1-3">
        {% endif %}
            <img loading="lazy" class="uk-thumbnail" src="{{ listening['img_url'] }}" alt="{{ listening['description'] }} - {{ listening['date'] }}">
            <figcaption>{{ listening['description'] }} - {{ listening['date'] }}</figcaption>
        </figure>
        {% if 'url' in listening %}</a>{% endif %}
    {% endfor %}
    </div>

</div>
{% endblock %}
